# X2Robot PI0.5 + RL-token joint SFT (RLT Stage 1), using RLinf's
# pre-#1435 official-OpenPI SFT model path (`model_type: openpi`).
#
# The X2 data semantics match x2robot_rlt_stage1_sft_openpi_pi05.yaml:
# 3 cameras, sm2sm, 3 history + current state, 20-step/28D actions, and
# action deltas relative to the current state. Model shape is supplied by the
# pi05_x2robot_sm2sm_rlt OpenPI TrainConfig rather than repeated in this YAML.

defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-1

runner:
  task_type: sft
  logger:
    log_path: "/mnt/public/xietingying/logs"
    project_name: rlinf-rlt
    experiment_name: "x2robot_rlt_stage1_sft_openpi_pi05_legacy"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 2000

data:
  num_workers: 8
  train_data_paths: "/mnt/public/xietingying/dataset/bagging_490"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 128
  seed: 42

  model:
    # Legacy RLinf SFT path backed by official OpenPI PI0Pytorch.
    model_type: "openpi"
    precision: null
    is_lora: False
    model_path: "/mnt/public/xietingying/ckpt/rlt-pi05/pi05_base_pytorch"
    num_action_chunks: 20
    num_steps: 4

    openpi_data:
      repo_id: "bagging_490"
      state_history_size: 3
      state_future_size: 0
      state_step: 1
      use_delta_actions: True
      random_drop_history: 0.50
      random_image_aug: 0.60
      norm_stats_path: "/home/xietingying/turtle/openpi-RLT/assets/rlt_pi05_bagging_490_stage1/bagging_490_state4"

    openpi:
      config_name: "pi05_x2robot_sm2sm_rlt"
      num_images_in_input: 3
      train_expert_only: False
      detach_critic_input: True

      # Legacy OpenPi0Config runtime/loss slicing controls. The underlying
      # OpenPI TrainConfig supplies action_horizon=20 and model action_dim=32.
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: 28
      num_steps: ${actor.model.num_steps}

      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      # 3 * 256 image tokens + 640 PI0.5 language/state tokens.
      rlt_prefix_seq_len: 1408
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    # Legacy OpenPI manages its selected BF16 parameters internally; leave
    # RLinf's outer FSDP mixed-precision policy disabled, as before #1435.
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
