# X2Robot PI0.5 + RL-token joint SFT (RLT Stage 1).
#
# This mirrors zxcx3:/home/xietingying/turtle/openpi-RLT/
# train_rlt_pi05_stage1.sh and its rlt_pi05_bagging_490_stage1 config:
# 3 cameras, sm2sm, 3 history + current state, 20-step/28D actions, and
# action deltas relative to the current state. The PI0.5 model remains 32D.

defaults:
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7

runner:
  task_type: sft
  logger:
    log_path: "/mnt/public/xietingying/logs"
    project_name: rlinf-rlt
    experiment_name: "x2robot_rlt_stage1_sft_openpi_pi05"
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 50000
  val_check_interval: -1
  save_interval: 2000

data:
  num_workers: 8
  train_data_paths: "/mnt/public/xietingying/dataset/bagging_490"

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 16
  global_batch_size: 128
  seed: 42

  model:
    model_type: "openpi_rlinf"
    precision: fp32
    is_lora: False
    pi05: True
    model_path: "/mnt/public/xietingying/ckpt/rlt-pi05/pi05_base_pytorch"
    num_action_chunks: 20
    action_dim: 28
    num_steps: 4
    add_value_head: False

    openpi_data:
      repo_id: "bagging_490"
      state_history_size: 3
      state_future_size: 0
      state_step: 1
      use_delta_actions: True
      random_drop_history: 0.50
      random_image_aug: 0.60
      # Existing stats computed by rlt_pi05_bagging_490_stage1 on zxcx3.
      # Point this at an equivalent copied directory on another machine.
      norm_stats_path: "/home/xietingying/turtle/openpi-RLT/assets/rlt_pi05_bagging_490_stage1/bagging_490_state4"

    openpi:
      task: sft
      config_name: "pi05_x2robot_sm2sm_rlt"
      num_images_in_input: 3
      train_expert_only: False
      detach_critic_input: True
      action_horizon: ${actor.model.num_action_chunks}
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      max_token_len: 640
      discrete_state_input: True

      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      # 3 * 256 image tokens + 640 PI0.5 language/state tokens.
      rlt_prefix_seq_len: 1408
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 1e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: "cosine"
    num_cycles: 0.5
    min_lr: 2.5e-6

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: bf16
      reduce_dtype: fp32
      buffer_dtype: fp32

reward:
  use_reward_model: False

critic:
  use_critic_model: False
