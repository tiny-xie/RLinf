# Collect a single-arm Franka LeRobot dataset for the pi0_realworld config.
#
# Physical setup:
#   - the left Franka from the dual-arm setup
#   - one LUMOS fisheye camera mounted on that arm
#   - the left PICO controller
#
# The robot/camera/node placement below comes from the supplied hardware
# configuration. Replace the remaining task/workspace values marked "REPLACE".
#
# Run from the RLinf repository root:
#   bash examples/embodiment/collect_data.sh realworld_collect_data_single_arm

defaults:
  - env/realworld_franka_sft_env@env.eval
  - _self_
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 2
  component_placement:
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: "4090"
      node_ranks: 0
    - label: franka
      node_ranks: 1
      hardware:
        type: Franka
        configs:
          - robot_ip: 172.16.0.2
            camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001216-video-index0"
            camera_type: lumos
            gripper_type: robotiq
            gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIR00N-if00-port0"
            node_rank: 1
            controller_node_rank: 1
            disable_validate: false

runner:
  task_type: embodied
  logger:
    log_path: null
    project_name: rlinf
    experiment_name: "collect-data-pi0-realworld-single-arm-pico"
    logger_backends: ["tensorboard"]
  num_data_episodes: 20
  record_task_description: False

env:
  group_name: "EnvGroup"
  eval:
    no_gripper: False
    ignore_terminations: False
    auto_reset: False

    use_spacemouse: False
    use_gello: False
    use_pico: True
    # Keep the same body-frame delta-action convention used by pi0_realworld.
    use_relative_frame: True

    # With one configured camera its default name is wrist_1. RealWorldEnv
    # writes this main view to the LeRobot "image" feature.
    main_image_key: wrist_1

    # Manual episode labels:
    #   a: start recording (or abort the current recording)
    #   b: advance segment_id
    #   c: finish and save the episode as successful
    keyboard_reward_wrapper: "start_end"
    max_episode_steps: 10000
    max_steps_per_rollout_epoch: 10000

    pico:
      # Use ipc:///tmp/vr_data.ipc when the publisher and env worker run on
      # the same machine. For different machines, replace this with
      # tcp://<vr-publisher-ip>:<port>.
      zmq_addr: "ipc:///tmp/vr_data.ipc"
      hand: "left"
      control_trigger: "grip"
      control_threshold: 0.85
      gripper_close_button: "X"
      gripper_open_button: "Y"
      gripper_close_threshold: 0.5
      # Conservative first-run gains; increase them after checking axes and
      # the workspace safety box without task objects.
      position_scale: 0.5
      rotation_scale: 0.5
      max_stale_s: 0.2
      calibration:
        enabled: True
        required: True
        auto_calibrate_on_start: True
        button: "trigger"
        threshold: 0.5
        head_forward_axis: "-z"
        base_position: [0.0, 0.0, 0.0]

    override_cfg:
      max_num_steps: 10000
      task_description: "REPLACE_WITH_YOUR_TASK_DESCRIPTION"

      # Explicitly name the only physical view used by this dataset.
      camera_names:
        "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001216-video-index0": wrist_1

      # REPLACE these workspace-dependent poses/bounds before enabling
      # robot motion. Pose order is [x, y, z, rx, ry, rz] (metres/radians).
      target_ee_pose: [0.5, 0.0, 0.1, -3.14, 0.0, 0.0]
      reset_ee_pose: [0.5, 0.0, 0.2, -3.14, 0.0, 0.0]
      ee_pose_limit_min: [0.4, -0.2, 0.05, -3.64, -0.5, -0.5]
      ee_pose_limit_max: [0.6, 0.2, 0.35, -2.64, 0.5, 0.5]
      success_hold_steps: 1
      use_dense_reward: False

    data_collection:
      enabled: True
      save_dir: ${runner.logger.log_path}/collected_data
      resume: True
      export_format: "lerobot"
      only_success: True
      robot_type: "franka_panda"
      fps: 10
