# Legacy RLT-SFT DAgger config. Keep this file independent from the newer
# openpi_rlinf config so the original `model_type: openpi` path remains usable.
defaults:
  - env/realworld_dual_franka_tcp_rot6d@env.train
  - env/realworld_dual_franka_tcp_rot6d@env.eval
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 3
  component_placement:
    actor:
      node_group: inference
      placement: 0
    rollout:
      node_group: inference
      placement: 0
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: franka
      node_ranks: 1-2
      env_configs:
        - node_ranks: 1-2
      hardware:
        type: DualFranka
        configs:
          - left_robot_ip: "172.16.0.2"
            right_robot_ip: "172.16.0.2"
            base_camera_serials:
              - "141722070657"
            base_camera_type: realsense
            left_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001216-video-index0"
            left_camera_type: lumos
            right_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001242-video-index0"
            right_camera_type: lumos
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIR00N-if00-port0"
            right_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIT8PU-if00-port0"
            left_controller_node_rank: 1
            right_controller_node_rank: 2
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "realworld_dual_franka_dagger_openpi_rlt_legacy_bulb"
    logger_backends: ["tensorboard"]
  max_epochs: 80000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 3000
  resume_dir: null
  ckpt_path: null

algorithm:
  dagger:
    # Only sample windows whose non-padding frames are all human/expert data.
    only_save_expert: True
    online_lerobot:
      enabled: True
      only_success: True
      robot_type: "dual_FR3"
      fps: 10
      finalize_interval: 1
      data_path: ${runner.logger.log_path}/online_lerobot
      # Optional offline LeRobot roots. Datasets without intervene_flag are
      # treated as expert demonstrations; flagged datasets remain filtered by
      # only_save_expert. Both singular preload_path and plural preload_paths
      # are supported by the worker.
      preload_paths: []
      # preload_paths:
      #   - /path/to/offline_lerobot_dataset
      rolling_lerobot_window_size: 50000
      min_frames: 1
      lerobot_num_workers: 0
  gamma: 0.99
  update_epoch: 1
  adv_type: gae
  loss_type: embodied_dagger

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 1
    smooth_intervene: True
    ignore_terminations: False
    auto_reset: True
    no_gripper: False
    use_spacemouse: False
    use_gello: False
    use_gello_joint: False
    use_pico: True
    # a=start, b=failure, c=success.
    keyboard_reward_wrapper: eval_control
    # Divisible by the legacy policy's 10-step action chunk.
    max_episode_steps: 1050
    max_steps_per_rollout_epoch: 1050
    pico:
      zmq_addr: "tcp://192.168.120.228:5555"
      hand: "dual"
      hold_current_when_inactive: False
      control_trigger: "grip"
      control_threshold: 0.85
      gripper_close_threshold: 0.5
      position_scale: 1.2
      rotation_scale: 1.0
      max_stale_s: 0.2
      calibration:
        enabled: True
        required: True
        auto_calibrate_on_start: True
        button: "trigger"
        threshold: 0.5
        head_forward_axis: "-z"
        base_position: [0.0, 0.0, 0.0]
      left:
        gripper_close_button: "X"
        gripper_open_button: "Y"
      right:
        gripper_close_button: "A"
        gripper_open_button: "B"
    override_cfg:
      is_dummy: False
      task_description: "Pick up the purple peg with your left hand and place it on the white plate"
      use_dense_reward: False
      max_num_steps: 1050
      rotation_repr: rot6d
      action_scale: [1.0, 1.0, 1.0]
      target_ee_pose:
        - [0.5, -0.2, 0.4, -3.14, 0.0, 0.0]
        - [0.5, 0.2, 0.4, -3.14, 0.0, 0.0]
      joint_reset_qpos:
        - [0.157, 0.0872, 0.0698, -1.6747, 0.2093, 2.5294, -0.45356]
        - [-0.2268, 0.2268, -0.1221, -1.50, 0.0523, 2.4073, 0]
      success_hold_steps: 1

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    ignore_terminations: False
    auto_reset: True
    no_gripper: False
    use_spacemouse: False
    use_gello: False
    use_gello_joint: False
    use_pico: False
    keyboard_reward_wrapper: eval_control
    max_episode_steps: 1050
    max_steps_per_rollout_epoch: 1050
    override_cfg:
      is_dummy: False
      task_description: ${env.train.override_cfg.task_description}
      use_dense_reward: False
      max_num_steps: 1050
      rotation_repr: rot6d
      action_scale: ${env.train.override_cfg.action_scale}
      target_ee_pose: ${env.train.override_cfg.target_ee_pose}
      joint_reset_qpos: ${env.train.override_cfg.joint_reset_qpos}
      success_hold_steps: 1

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: False
  collect_prev_infos: False
  sync_weight_nccl_max_ctas: 32
  model:
    # Legacy checkpoint layout:
    #   model_state_dict/full_weights.pt
    #   dual_peg_merged/norm_stats.json
    model_path: "/home/user/jzn/checkpoints/actor"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 1
  global_batch_size: 1
  seed: 1234
  enable_offload: False
  model:
    model_type: "openpi"
    model_path: ${rollout.model.model_path}
    precision: null
    load_to_device: True
    is_lora: False
    add_value_head: False
    action_dim: 20
    num_action_chunks: 10
    num_steps: 3
    openpi_data:
      repo_id: "dual_peg_merged"
    openpi:
      config_name: "pi05_dualfranka_tcp_rot6d_state"
      num_images_in_input: 3
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      state_indices: []
      noise_method: "flow_ode"
      joint_logprob: True
      train_expert_only: True
      detach_critic_input: True
      # Preserve the old RLT SFT auxiliary loss during DAgger updates.
      use_rlt: True
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: False
      rlt_use_mask: True

  optim:
    lr: 5.0e-6
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 4.0
    warmup_style: "cosine"
    lr_warmup_steps: 20
    total_training_steps: 80000

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    use_orig_params: False
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
