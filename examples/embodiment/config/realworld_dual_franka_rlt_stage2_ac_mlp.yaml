defaults:
  - env/realworld_dual_franka_tcp_rot6d@env.train
  - env/realworld_dual_franka_tcp_rot6d@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # Node 0: rollout / inference / actor node.
  # Node 1: left-arm control node; env worker and all three cameras run here.
  # Node 2: right-arm control node.
  num_nodes: 3
  component_placement:
    actor:
      node_group: inference
      placement: 0
    rollout:
      node_group: inference
      placement: 0
    env:
      node_group: franka
      placement: 0
  node_groups:
    - label: inference
      node_ranks: 0
    - label: franka
      node_ranks: 1-2
      hardware:
        type: DualFranka
        configs:
          # The DualFranka env/camera process runs on node 1, so all three
          # cameras below must be physically visible on node 1. Each arm's
          # low-level controller is launched on its own robot control node.
          - left_robot_ip: "172.16.0.2"
            right_robot_ip: "172.16.0.2"
            base_camera_serials:
              - "141722070657"
            base_camera_type: realsense
            left_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001216-video-index0"
            left_camera_type: lumos
            right_camera_serials:
              - "usb-XVisio_Technology_XVisio_vSLAM_250801DR48FB26001242-video-index0"
            right_camera_type: lumos
            left_gripper_type: robotiq
            right_gripper_type: robotiq
            left_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIR00N-if00-port0"
            right_gripper_connection: "/dev/serial/by-id/usb-FTDI_USB_TO_RS-485_DAAIT8PU-if00-port0"
            left_controller_node_rank: 1
            right_controller_node_rank: 2
            node_rank: 1

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "realworld_dual_franka_rlt_stage2_ac_mlp"
    logger_backends: ["tensorboard"]

  max_epochs: 8000
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: -1

  # Resume a saved Stage2 training run from a full RLinf checkpoint directory.
  # Do not point this to the Stage1 OpenPI checkpoint.
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  group_size: 1
  # Critic target Q aggregation: min, mean, or q1.
  agg_q: min
  # Actor objective Q aggregation: q1 preserves original; mean matches RLinf-con.
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}

  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  # RLT Stage2 actor loss: -q_weight * Q + bc_weight * BC.
  q_weight: 0.1
  bc_weight: 5
  reference_dropout_prob: 0.5

  bootstrap_type: standard
  gamma: 0.96
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 200
    min_buffer_size: 2
    sample_window_size: 200
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  # Set to 2 to match RLinf-con's critic-target Q subsampling.
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    no_gripper: False
    use_spacemouse: False
    use_gello: False
    use_gello_joint: False
    use_pico: True
    # Pedals for RLT: a=start episode under reference, b=switch to actor,
    # c=success. Failure is timeout.
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 600
    max_steps_per_rollout_epoch: 600
    pico:
      zmq_addr: "tcp://192.168.120.228:5555"
      hand: "dual"
      # For DAgger, inactive frames should stay as policy actions and not be
      # marked as expert labels. Active PICO frames still override per arm.
      hold_current_when_inactive: False
      control_trigger: "grip"
      control_threshold: 0.85
      gripper_close_threshold: 0.5
      position_scale: 0.5
      rotation_scale: 0.5
      max_stale_s: 0.2
      calibration:
        enabled: True
        required: True
        auto_calibrate_on_start: True
        button: "trigger"
        threshold: 0.5
        head_forward_axis: "-z"
        base_position: [0.0, 0.0, 0.0]
      left:
        gripper_close_button: "X"
        gripper_open_button: "Y"
      right:
        gripper_close_button: "A"
        gripper_open_button: "B"
    override_cfg:
      is_dummy: False
      task_description: "Use the right arm to pick up the purple peg, hand it over to the left arm, and then insert the peg into the white box."
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 600
      rotation_repr: rot6d
      action_scale: [1.0, 1.0, 1.0]
      # Replace with the first-frame joint means used by your Stage1 dataset.
      target_ee_pose:
        - [0.5, -0.2, 0.4, -3.14, 0.0, 0.0]
        - [0.5,  0.2, 0.4, -3.14, 0.0, 0.0]
      joint_reset_qpos:
        - [0.0677, 0.1155, 0.1334, -1.5898, 0.1972, 2.1341, -0.5112]
        - [-0.793, 0.0619, 0.5339, -1.5889, -0.2269, 2.2873, 0.1622]
      success_hold_steps: 1

  eval:
    rollout_epoch: 1
    total_num_envs: 1
    auto_reset: True
    ignore_terminations: False
    no_gripper: False
    use_spacemouse: False
    use_gello: False
    use_gello_joint: False
    use_pico: False
    keyboard_reward_wrapper: rlt_policy_switch
    max_episode_steps: 300
    max_steps_per_rollout_epoch: 300
    use_fixed_reset_state_ids: False
    group_size: 1
    pico:
      zmq_addr: "tcp://192.168.120.228:5555"
      hand: "dual"
      # For DAgger, inactive frames should stay as policy actions and not be
      # marked as expert labels. Active PICO frames still override per arm.
      hold_current_when_inactive: False
      control_trigger: "grip"
      control_threshold: 0.85
      gripper_close_threshold: 0.5
      position_scale: 0.5
      rotation_scale: 0.5
      max_stale_s: 0.2
      calibration:
        enabled: True
        required: True
        auto_calibrate_on_start: True
        button: "trigger"
        threshold: 0.5
        head_forward_axis: "-z"
        base_position: [0.0, 0.0, 0.0]
      left:
        gripper_close_button: "X"
        gripper_open_button: "Y"
      right:
        gripper_close_button: "A"
        gripper_open_button: "B"
    override_cfg:
      is_dummy: False
      task_description: ${env.train.override_cfg.task_description}
      use_dense_reward: False
      reward_scale: 1.0
      max_num_steps: 300
      rotation_repr: rot6d
      action_scale: ${env.train.override_cfg.action_scale}
      joint_reset_qpos: ${env.train.override_cfg.joint_reset_qpos}
      target_ee_pose: ${env.train.override_cfg.target_ee_pose}
      success_hold_steps: 1
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1

  collect_transitions: True
  collect_prev_infos: False

  # Synced Stage2 MLP policy used by rollout inference.
  model:
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}

  # Frozen Stage1 pi0.5 + RLT token transformer.
  rlt_feature_model:
    model_type: "openpi"
    precision: null
    is_lora: False
    model_path: "/path/to/dual_franka/stage1/checkpoint"
    openpi_data:
      repo_id: "dual_franka_tcp_rot6d_rlt_stage1"
    openpi:
      # Must match the Stage1 checkpoint. Use the *_state config when Stage1
      # was trained with discrete_state_input=True.
      config_name: "pi05_dualfranka_tcp_rot6d_state"
      num_images_in_input: 3
      action_chunk: ${actor.model.ref_num_action_chunks}
      num_steps: 4
      # Keep the collected 20D raw state as Stage2 proprio.
      state_indices: []
      noise_method: "flow_noise"
      noise_params: [0.16, 0.12, 200]
      joint_logprob: True
      use_rlt: True
      rlt_prefix_seq_len: 1024
      # Must match the Stage1 checkpoint. Options: append_self_attention, cross_attention
      rlt_encoder_type: "cross_attention"
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: True
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"

  micro_batch_size: 256
  global_batch_size: 256
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    actor_std_mode: "fixed"
    fixed_std: 0.002
    is_lora: False

    # Dual-Franka TCP rot6d Stage2 MLP input/output shape.
    z_dim: 2048
    proprio_dim: 20
    action_dim: 20
    num_action_chunks: 10
    ref_num_action_chunks: 20

  optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 3e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
