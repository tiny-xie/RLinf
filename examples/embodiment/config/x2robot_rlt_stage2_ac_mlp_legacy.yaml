# X2Robot RLT Stage 2 using RLinf's pre-#1435 official-OpenPI feature path.
# The frozen legacy Stage1 PI0.5 model supplies z_rl and the 20x28 reference
# chunk; the trainable Stage2 MLP consumes z_rl + current 32D proprio + chunk.

defaults:
  - env/x2robot_tcp@env.train
  - env/x2robot_tcp@env.eval
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  # The X2Robot slave is a TCP client, not an RLinf/Ray node.
  num_nodes: 1
  component_placement:
    # Legacy real-world Stage2 colocates actor/env/rollout on one inference GPU.
    # This also keeps micro_batch_size=global_batch_size=128 valid when zxcx2
    # exposes two GPUs; using `all` would create an actor world size of two.
    actor,env,rollout: 0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf-rlt
    experiment_name: "x2robot_rlt_stage2_ac_mlp_legacy"
    logger_backends: ["tensorboard"]
  max_epochs: 8000
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 50
  resume_dir: null
  ckpt_path: null

algorithm:
  update_epoch: 8
  rlt_schedule:
    enable: True
    max_updates_per_train_step: 400
    warmup_min_size: 600
    warmup_post_collect_updates: 20000
    train_every_episodes: 0
    train_every_transitions: 5
  group_size: 1
  agg_q: min
  actor_agg_q: q1
  enable_drq: False
  q_head_type: ${actor.model.q_head_type}
  adv_type: embodied_sac
  loss_type: rlt_ac
  loss_agg_func: "token-mean"

  q_weight: 0.1
  bc_weight: 5.0
  reference_dropout_prob: 0.5
  bootstrap_type: standard
  gamma: 0.99
  tau: 0.005

  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
    optim:
      lr: 3.0e-4
      lr_scheduler: torch_constant
      clip_grad: 10.0

  replay_buffer:
    enable_cache: True
    cache_size: 2000
    min_buffer_size: 32
    sample_window_size: 2000
    auto_save: False

  target_update_freq: 1
  target_update_type: all
  train_actor_steps: 2
  critic_actor_ratio: 4
  critic_subsample_size: 0
  backup_entropy: False

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 240
    # Match pi05_x2robot_sm2sm_rlt: [3 history, 1 current, 0 future].
    override_cfg:
      state_history_size: 3
      state_future_size: 0
      state_step: 1
      latency_step: 0
    rlt_default_actor_switch: True
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    max_steps_per_rollout_epoch: 240
    override_cfg:
      state_history_size: 3
      state_future_size: 0
      state_step: 1
      latency_step: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  enable_offload: False
  pipeline_stage_num: 1
  collect_transitions: True
  collect_prev_infos: True

  # Synced, trainable Stage2 actor-critic MLP.
  model:
    model_type: ${actor.model.model_type}
    model_path: null
    precision: ${actor.model.precision}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    ref_num_action_chunks: ${actor.model.ref_num_action_chunks}
    z_dim: ${actor.model.z_dim}
    proprio_dim: ${actor.model.proprio_dim}
    add_q_head: ${actor.model.add_q_head}
    q_head_type: ${actor.model.q_head_type}
    fixed_std: ${actor.model.fixed_std}

  # Frozen Stage1 model using the legacy RLinf/official-OpenPI implementation.
  rlt_feature_model:
    model_type: "openpi"
    precision: null
    is_lora: False
    # Replace with the actor directory produced by the legacy Stage1 YAML.
    model_path: "/path/to/x2robot_rlt_stage1_sft_openpi_pi05_legacy/checkpoints/global_step_50000/actor"
    num_action_chunks: 20
    num_steps: 4

    openpi_data:
      repo_id: "bagging_490"
      state_history_size: 3
      state_future_size: 0
      state_step: 1
      use_delta_actions: True
      # Kept identical to Stage1; stochastic transforms apply only when the
      # transform sample contains actions, so rollout inference is deterministic.
      random_drop_history: 0.50
      random_image_aug: 0.60
      norm_stats_path: "/home/xietingying/turtle/openpi-RLT/assets/rlt_pi05_bagging_490_stage1/bagging_490_state4"

    openpi:
      config_name: "pi05_x2robot_sm2sm_rlt"
      num_images_in_input: 3
      train_expert_only: False
      detach_critic_input: True
      action_chunk: ${actor.model.ref_num_action_chunks}
      action_env_dim: 28
      num_steps: ${rollout.rlt_feature_model.num_steps}
      # X2 input state is [B, 4, 32]; Stage2 proprio is the current frame.
      state_sequence_index: 3

      use_rlt: True
      rlt_alpha: 1.0
      rlt_input_dim: 2048
      rlt_embed_dim: 2048
      rlt_prefix_seq_len: 1408
      rlt_num_layers: 2
      rlt_num_heads: 8
      rlt_mlp_ratio: 4.0
      rlt_image_only: False
      rlt_use_mask: True

  enable_torch_compile: False
  enable_cuda_graph: False

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 128
  seed: 1234
  enable_offload: False

  model:
    model_type: "rlt_mlp_policy"
    precision: fp32
    add_value_head: False
    add_q_head: True
    q_head_type: "default"
    fixed_std: 0.002
    is_lora: False
    z_dim: 2048
    proprio_dim: 32
    action_dim: 28
    num_action_chunks: 20
    ref_num_action_chunks: 20

  optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  critic_optim:
    clip_grad: 10.0
    lr: 1.0e-4
    lr_scheduler: torch_constant

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
